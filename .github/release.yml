# .github/release.yml

changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking Changes 🛠
      labels:
        - Semver-Major
        - breaking-change
    - title: Exciting New Features 🎉
      labels:
        - Semver-Minor
        - new-feature
        - enhancement
    - title: Bug Fixes 🐛
      labels:
        - bugfix
    - title: Other Changes
      labels:
        - "*"
