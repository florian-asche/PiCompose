<svg xmlns="http://www.w3.org/2000/svg" width="400" height="60" viewBox="0 0 400 60" role="img" aria-label="PiCompose: Plug and play. Insert the SD card into the Raspberry Pi and start with the voice assistant.">
  <title>PiCompose: Plug and play. Insert the SD card into the Raspberry Pi and start with the voice assistant.</title>
  <defs>
    <clipPath id="round"><rect width="400" height="60" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="400" height="60" fill="#2b2f36"/>
    <rect width="64" height="60" fill="#18bcf2"/>
    <rect x="336" width="64" height="60" fill="#18bcf2"/>
  </g>

  <!-- SD card icon -->
  <g transform="translate(18 14)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M4 0 H20 L28 8 V32 H4 Z" fill="#fff" fill-opacity="0.15"/>
    <path d="M10 5 V11 M14 5 V11 M18 5 V11"/>
  </g>

  <!-- Texts -->
  <g font-family="Verdana, DejaVu Sans, sans-serif" fill="#fff">
    <text x="80" y="19" font-size="12.5" font-weight="700">PiCompose</text>
    <text x="80" y="34" font-size="10.5" fill="#c9d1db">Plug &amp; play: SD card in, power on</text>
    <text x="80" y="49" font-size="10.5" fill="#c9d1db">Ready to talk</text>
  </g>

  <!-- Arrows -->
  <g fill="none" stroke="#8a94a3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 30 H312 M307 25 L312 30 L307 35"/>
  </g>

  <!-- Microphone icon -->
  <g transform="translate(354 13)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="0" width="10" height="20" rx="5" fill="#fff" fill-opacity="0.15"/>
    <path d="M1 14 C1 22 21 22 21 14"/>
    <path d="M11 24 V32 M5 32 H17"/>
  </g>
</svg>
